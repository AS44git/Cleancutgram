# Builds the patched APKs from a stock Instagram APK and publishes them as a
# GitHub release, which is what the in-app updater checks.
#
# Run it from the repository's Actions tab ("Build and release" -> Run workflow).
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    your signing keystore, base64-encoded
#                      (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("feurstagram.keystore")))
#   KEYSTORE_PASS      the keystore password
#   KEY_PASS           the key password (optional, defaults to KEYSTORE_PASS)
#   GPR_TOKEN          a classic GitHub token with the read:packages scope, for the
#                      Morphe patcher on GitHub Packages (optional: the workflow's
#                      own token is tried when it is not set)
#
# Always sign releases with the same keystore: Android refuses an update signed
# with a different key, so losing it means every user has to uninstall.

name: Build and release

on:
  workflow_dispatch:
    inputs:
      stock_apk:
        description: "Stock Instagram APK: release:NAME (an .apk/.apkm on that release, drafts too) or a direct https:// link"
        required: true
        default: "release:stock-apk"
      notes:
        description: "Release notes (shown in the app's update and What's new screens)"
        required: false
        default: ""
      morphe_cli_version:
        description: "Morphe CLI release tag"
        required: false
        default: "v1.20.0"
      prerelease:
        description: "Mark as a pre-release (the updater only offers the latest full release)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); only the
      # exact platform and build-tools versions are added.
      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch the Morphe CLI and APKEditor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          gh release download "${{ inputs.morphe_cli_version }}" -R MorpheApp/morphe-cli -p 'morphe-*.jar' -D tools/
          gh release download V1.4.9 -R REAndroid/APKEditor -p 'APKEditor-1.4.9.jar' -D tools/
          ls -l tools

      - name: Fetch the stock Instagram APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="$(bash .github/scripts/fetch-stock-apk.sh "${{ inputs.stock_apk }}")"
          echo "STOCK_APK=$file" >> "$GITHUB_ENV"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Releases must be signed with your own keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > feurstagram.keystore

      - name: Build the classic and clone APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          FEURSTAGRAM_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          FEURSTAGRAM_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x build.sh gradlew
          mkdir -p dist
          ./build.sh "$STOCK_APK"
          mv feurstagram.apk dist/app.apk
          ./build.sh "$STOCK_APK" --clone
          mv feurstagram.apk dist/app-clone.apk

      - name: Work out the version
        run: |
          aapt2="$(ls -t "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)"
          version="$("$aapt2" dump badging dist/app.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          if [ -z "$version" ]; then echo "::error::could not read versionName"; exit 1; fi
          # The updater compares the tag with Instagram's versionName plus this
          # fork's Brand.REVISION, so the tag is both with dots as dashes:
          # 454.0.0.13.77 at revision 3 -> v454-0-0-13-77-3.
          brand=extensions/extension/src/main/java/com/feurstagram/extension/Brand.java
          revision="$(sed -n 's/.*int REVISION = \([0-9][0-9]*\);.*/\1/p' "$brand")"
          if [ -z "$revision" ]; then echo "::error::could not read REVISION from Brand.java"; exit 1; fi
          tag="v${version//./-}-$revision"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          slug="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          # Asset names: the updater takes the ".apk" one for classic installs and
          # the "-clone.apk" one for clone installs.
          mv dist/app.apk "dist/$slug-$tag.apk"
          mv dist/app-clone.apk "dist/$slug-$tag-clone.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist; cat dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump REVISION in Brand.java for a new release."
            exit 1
          fi
          args=("$TAG" dist/*.apk dist/SHA256SUMS.txt --title "$TAG")
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--generate-notes); fi
          [ "${{ inputs.prerelease }}" = "true" ] && args+=(--prerelease)
          gh release create "${args[@]}"
